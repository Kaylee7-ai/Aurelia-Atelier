<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact | VECLÉRIA</title>
  <meta name="description" content="Contact VECLÉRIA for orders, styling advice, custom requests and support.">
  <meta name="theme-color" content="#0f2e22">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-page="contact">
  <a class="skip" href="#main">Skip to content</a>
  <div id="siteHeader"></div>
  <main id="main">
    <section class="page-head"><div class="container"><span class="eyebrow">Get in touch</span><h1>We’d love to hear from you</h1><p class="lead" style="margin-inline:auto">Questions, orders, styling advice or a custom request? Send us a message.</p></div></section>
    <div class="container contact-grid">
      <div class="info">
        <div><h3>Visit</h3><p data-cfg="address"></p></div>
        <div><h3>Call or WhatsApp</h3><p data-cfg="phone"></p></div>
        <div><h3>Email</h3><p data-cfg="email"></p></div>
        <div><h3>Instagram</h3><p data-cfg="instagram"></p></div>
        <div><h3>Hours</h3><p data-cfg="hours"></p></div>
      </div>
      <form class="box" onsubmit="return false" aria-label="Contact form">
        <div class="two"><div class="field"><label for="ctName">Name</label><input class="input" id="ctName" autocomplete="name"></div><div class="field"><label for="ctContact">Phone or email</label><input class="input" id="ctContact"></div></div>
        <div class="field"><label for="ctTopic">Topic</label><select class="input" id="ctTopic"><option>Order enquiry</option><option>Styling advice</option><option>Custom piece</option><option>Delivery and returns</option><option>Something else</option></select></div>
        <div class="field"><label for="ctMsg">Message</label><textarea class="input" id="ctMsg"></textarea></div>
        <a class="btn btn-wa btn-block" id="ctSend" href="#" target="_blank" rel="noopener">Send on WhatsApp ↗</a>
      </form>
    </div>
  </main>
  <div id="siteFooter"></div>

  <script src="app.js" defer></script>
</body>
</html>
